name: Validate
on: [push, pull_request]
jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/public-safety.mjs
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
      - run: npm run package
        # electron-builder skips signing on pull requests; the ad-hoc identity holds no secret.
        env:
          CSC_FOR_PULL_REQUEST: "true"
      - run: npm run test:package
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Most of the suite still expects POSIX paths; these cover the code that differs on Windows.
      - run: node --test packages/platform/shell.test.ts packages/platform/private-files.test.ts packages/platform/process-tree.test.ts packages/platform/local-endpoint.test.ts packages/core/updates.test.ts
      - run: npm run build
      - run: npm run package
      - run: npm run test:package
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner restricts unprivileged user namespaces like desktop Ubuntu; CI lifts it instead of loading a profile.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The runtime tests start the macOS default shell, which Ubuntu runners lack.
      - run: sudo apt-get install -y zsh
      # Runner images leave zsh's function folders group-writable, so compinit stops at its insecure-directories question; a desktop's are not.
      - run: zsh -c 'autoload -Uz compaudit; compaudit || true' | xargs -r sudo chmod g-w,o-w
      - run: npm run check
      - run: xvfb-run -a npm run test:runtime
      - run: npm run package
      - run: xvfb-run -a npm run test:package
