name: Validate
on: [push, pull_request]
jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:runtime
      - run: npm run package
        # electron-builder skips signing on pull requests; the ad-hoc identity holds no secret.
        env:
          CSC_FOR_PULL_REQUEST: "true"
      - run: npm run test:package
