name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: win-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: The tag names the package version
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run package
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - if: runner.os != 'Linux'
        run: npm run test:package
      # ditto keeps the bundle's symlinks and ad-hoc signature, which a plain zip breaks.
      - if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "release/staged/mac-arm64/Agentic Crafting Table.app" "agentic-crafting-table-$GITHUB_REF_NAME-${{ matrix.platform }}.zip"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "release/staged/win-x64/Agentic Crafting Table" -DestinationPath "agentic-crafting-table-$env:GITHUB_REF_NAME-${{ matrix.platform }}.zip"
      - if: runner.os == 'Linux'
        run: tar -czf "agentic-crafting-table-$GITHUB_REF_NAME-${{ matrix.platform }}.tar.gz" -C release/staged/linux-x64 "Agentic Crafting Table"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: agentic-crafting-table-*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
      - run: gh release create "$GITHUB_REF_NAME" assets/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
