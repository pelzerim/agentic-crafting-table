    function moveMapNode(n,x,y,group=false){const dx=x-n.x,dy=y-n.y;if(group){nodes.filter(r=>r.id===n.id||r.project===n.id).forEach(r=>{r.x+=dx;r.y+=dy});savedSessions.filter(s=>s.project===n.id).forEach(s=>{s.x+=dx;s.y+=dy})}else{n.x=x;n.y=y}}
    const standardAgentRender=plugins.agent.render;
    plugins.agent.render=n=>n.inlineSession?`<div class="cm-line"><span class="cm-eyebrow">${esc(n.provider)} · ${esc(n.model)}</span><small>Sample session</small></div><pre class="cm-terminal"><span class="cm-ok">✓ Initial context prepared</span>\n\n› ${esc(n.reply||n.task||n.title)}</pre><details><summary>Initial context</summary><pre>${esc(n.initialPrompt)}</pre></details><form class="cm-compose" data-form="reply"><input aria-label="Reply to agent" name="reply" placeholder="Reply in this session…" required><button type="submit" aria-label="Send reply">${icon('arrow-up')}</button></form>${refButtons(n)}`:standardAgentRender(n);
    const agentDetailRender=plugins.agent.render;
    plugins.agent.render=n=>n.provider?.toLowerCase()==='claude'&&!n.review&&!n.architecture?nativeTerminalBody(n):agentDetailRender(n);
    let drag=null;
    function hitNode(point,exclude){return Object.entries(state.view).reverse().sort(([a],[b])=>Number(getComputedStyle(state.elements.get(b)).zIndex)-Number(getComputedStyle(state.elements.get(a)).zIndex)).find(([id,r])=>id!==exclude&&!state.elements.get(id).hidden&&!state.elements.get(id).inert&&point.x>=r.x&&point.x<=r.x+r.w&&point.y>=r.y&&point.y<=r.y+r.h)?.[0]}
    function cancelDrag(){if(!drag)return;const d=drag;drag=null;markTodoDrop(null);if(d.moved){restoreDragPositions(d);state.camera=d.initialCamera}if(scene.hasPointerCapture(d.pointer))scene.releasePointerCapture(d.pointer);state.linking=null;state.attachCandidate=null;state.blocked=Date.now()+250;delete root.dataset.dragging;draw()}
    scene.addEventListener('pointerdown',e=>{
      if(e.button!==0||e.target.closest('.cm-creator, .cm-context-menu, .cm-todos'))return;
      const port=e.target.closest('[data-port]'),article=e.target.closest('[data-node]'),summary=e.target.closest('.cm-summary'),header=e.target.closest('.cm-detail-head'),interactive=e.target.closest('button,input,select,textarea,summary,a');
      if(!port&&interactive&&!summary)return;if(article?.classList.contains('cm-open')&&!header||state.mode==='item'&&!article)return;
      cancelAnimationFrame(state.frame);const point=scenePoint(e),id=port?.dataset.port||article?.dataset.node,n=get(id);
      drag={id,kind:port?'link':id?'node':'pan',group:n?.kind==='project',openOnClick:Boolean(summary),wasOpen:article?.classList.contains('cm-open'),x:e.clientX,y:e.clientY,camera:{...state.camera},initialCamera:{...state.camera},origin:n?{x:n.x,y:n.y}:null,positions:nodes.map(n=>({id:n.id,x:n.x,y:n.y})),sessions:savedSessions.map(s=>({id:s.id,x:s.x,y:s.y})),moved:false,pointer:e.pointerId};
      if(port){closeCreator();state.linking={source:id,...point}}scene.setPointerCapture(e.pointerId);
    });
    scene.addEventListener('pointermove',e=>{
      if(!drag||e.pointerId!==drag.pointer)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(!drag.moved)return;e.preventDefault();root.dataset.dragging='true';
      if(drag.kind==='node'){const n=get(drag.id);if(drag.wasOpen){state.mode=drag.group||!n.project?'workspace':'project';state.project=n.project||null;state.selected=null;state.departure=null;state.expanded=0;state.camera=state.mode==='workspace'?workspaceCamera():projectCamera(state.project);const point=scenePoint(e),world=worldPoint(point.x,point.y+24);moveMapNode(n,world.x,world.y,drag.group);drag.x=e.clientX;drag.y=e.clientY;drag.origin={x:n.x,y:n.y};drag.camera={...state.camera};drag.wasOpen=false;renderTrail()}else moveMapNode(n,drag.origin.x+dx/drag.camera.s,drag.origin.y+dy/drag.camera.s,drag.group);state.attachCandidate=attachmentTarget(n);separateVisible(n.id)}
      else if(drag.kind==='pan'){state.camera.x=drag.camera.x-dx/drag.camera.s;state.camera.y=drag.camera.y-dy/drag.camera.s}
      else Object.assign(state.linking,scenePoint(e));if(drag.kind!=='pan')markTodoDrop(todoDropAt(e));draw();
    });
    scene.addEventListener('pointerup',e=>{
      if(!drag||e.pointerId!==drag.pointer)return;const d=drag,point=scenePoint(e);drag=null;delete root.dataset.dragging;if(scene.hasPointerCapture(e.pointerId))scene.releasePointerCapture(e.pointerId);state.blocked=Date.now()+250;state.linking=null;
      const task=d.moved&&d.kind!=='pan'?todoDropAt(e):null;markTodoDrop(null);if(task){restoreDragPositions(d);state.attachCandidate=null;attachTodo(task,d.id);draw();return}const overlay=todoOverlay.getBoundingClientRect();if(todoState.open&&d.moved&&e.clientX>=overlay.left&&e.clientX<=overlay.right&&e.clientY>=overlay.top&&e.clientY<=overlay.bottom){restoreDragPositions(d);state.attachCandidate=null;draw();return ping('Drop onto a task to attach this item')}
      if(d.kind==='link'){const target=d.moved?hitNode(point,d.id):null;if(target){const connected=connectItems(d.id,target);renderTrail();draw();if(connected)ping('Items connected');return}if(point.x>=0&&point.x<=scene.clientWidth&&point.y>=0&&point.y<=scene.clientHeight){const r=state.view[d.id];return beginCreate(d.moved?worldPoint(point.x,point.y):worldPoint(r.x+r.w+160,r.cy),d.id)}}
      else if(!d.moved&&d.openOnClick)return openNode(d.id);
      else if(!d.moved&&d.kind==='pan'){closeCreator();draw();return}
      else if(d.moved&&d.kind==='node')return finishMove(get(d.id));
      else if(d.moved)ping('Map and neighborhood moved together');state.attachCandidate=null;draw();
    });
    scene.addEventListener('pointercancel',()=>{markTodoDrop(null);cancelDrag()});
    root.addEventListener('keydown',e=>{const direction={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(!direction)return;const button=e.target.closest('.cm-summary');if(button&&e.altKey){e.preventDefault();const n=get(button.dataset.open);moveMapNode(n,n.x+direction[0]*16,n.y+direction[1]*16,n.kind==='project');separateVisible(n.id);finishMove(n)}else if(e.shiftKey&&state.mode!=='item'&&!e.target.closest('input,textarea,select')){e.preventDefault();state.camera.x-=direction[0]*40/state.camera.s;state.camera.y-=direction[1]*40/state.camera.s;draw()}});
    scene.addEventListener('wheel',e=>{
      if(e.target.closest('.cm-creator, .cm-todos, .cm-map-controls')||state.mode==='item'&&e.target.closest('.cm-open')&&!e.ctrlKey&&!e.metaKey||!e.deltaY)return;
      closeMapMenu();e.preventDefault();
      if(state.mode==='item'){if(e.deltaY>0)back();return}
      const unit=e.deltaMode===1?16:e.deltaMode===2?scene.clientHeight:1,delta=Math.max(-120,Math.min(120,e.deltaY*unit));
      setZoom(state.camera.s*Math.exp(-delta*(e.ctrlKey||e.metaKey ? .006 : .002)),scenePoint(e));
    },{passive:false});
    nodes.forEach(mount);separateVisible();state.camera=workspaceCamera();renderTrail();renderTodos();draw();icons();let lastWidth=scene.clientWidth;new ResizeObserver(()=>{if(scene.clientWidth!==lastWidth){lastWidth=scene.clientWidth;state.overviewCamera=null;if(state.mode==='workspace')state.camera=workspaceCamera();else if(state.mode==='project')state.camera=projectCamera(state.project);if(state.selected)fillDetail(get(state.selected));draw()}}).observe(scene);
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{draw()}});tweak.addSelect(state,'finish',{label:'Visual style',options:[{label:'Pixel bubbles',value:'pixel'},{label:'Soft original',value:'soft'}]});tweak.addSelect(state,'typeStyle',{label:'Item identity',options:[{label:'Color + shape',value:'shapes'},{label:'Color only',value:'color'}]});tweak.addSlider(state,'typeTint',{label:'Bubble color tint',min:0,max:14,step:1,unit:'%'});tweak.addSlider(state,'focusInset',{label:'Map edge in focus view',min:8,max:40,step:4,unit:'px'});tweak.addSlider(state,'motion',{label:'Camera transition',min:250,max:800,step:50,unit:'ms'})}
  })();
